name: Release Builds

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0, v2.1.3
  workflow_dispatch: # Manual runs hit the release gate and stop: publication requires a tag

jobs:
  verify:
    name: Verify release gate
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Тот же локфайл, что и у сборки: релизный гейт обязан проверять
          # ровно то дерево, которое уедет пользователю.
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Release tag gate
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "RELEASE-GATE: release workflow requires a version tag (got ${GITHUB_REF})" >&2
            exit 1
          fi
          python tools/verify_release_tag.py --tag "${GITHUB_REF_NAME}"

      - name: Run release checks
        run: python tools/run_checks.py --release

  build:
    name: Build on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt: точные версии всего дерева. Без него сборка
          # брала то, что оказалось свежим в день выпуска, и так в релиз
          # уехал numpy 2.4, роняющий старт на старых процессорах.
          python -m pip install -r requirements.txt -c constraints.txt
          # Закреплено на версии, которую незакреплённая установка даёт
          # сегодня: сборка не меняется, но мажорный скачок PyInstaller
          # больше не прилетит в релиз сам собой.
          python -m pip install pyinstaller==6.22.3

      - name: Generate build identity
        shell: bash
        run: |
          python tools/generate_build_identity.py \
            --tag "${GITHUB_REF_NAME}" \
            --commit "$(git rev-parse HEAD)" \
            --repository "${GITHUB_REPOSITORY}" \
            --output update-build.json

      - name: Run PyInstaller
        run: pyinstaller translatorFork_MOD.spec

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          iscc "/DMyAppVersion=$version" "/DMyRepository=$env:GITHUB_REPOSITORY" windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - "dist/GeminiTranslator.app"
          # Без --ignore-scripts сознательно: create-dmg тянет appdmg →
          # fs-xattr, а это нативный аддон с install: node-gyp rebuild.
          # Запрет скриптов сломал бы сборку DMG, и || true ниже молча
          # подсунул бы пользователям macOS архив вместо образа.
          npm install -g create-dmg@8.1.0
          create-dmg dist/GeminiTranslator.app || true
          mv *.dmg GeminiTranslator-macOS.dmg || true
          # Fallback to ZIP if create-dmg fails (which can happen on some CI environments)
          if [ ! -f GeminiTranslator-macOS.dmg ]; then
            cd dist
            zip -y -r ../GeminiTranslator-macOS.zip GeminiTranslator.app
            cd ..
          fi

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-Windows-Installer
          path: installer_output/GeminiTranslator-Setup.exe

      - name: Upload Windows Artifact (Portable EXE)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-Windows-Portable
          path: dist/GeminiTranslator-Portable.exe

      - name: Upload macOS Artifact (DMG)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-macOS-DMG
          path: GeminiTranslator-macOS.dmg
          if-no-files-found: ignore

      - name: Upload macOS Artifact (ZIP)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-macOS-ZIP
          path: GeminiTranslator-macOS.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to release dir
        run: |
          mkdir release_assets
          find artifacts -type f -name "*.zip" -exec mv {} release_assets/ \;
          find artifacts -type f -name "*.dmg" -exec mv {} release_assets/ \;
          find artifacts -type f -name "*.exe" -exec mv {} release_assets/ \;

      - name: Generate and validate update manifest
        run: |
          python tools/generate_update_manifest.py \
            --tag "${GITHUB_REF_NAME}" \
            --commit "$(git rev-parse HEAD)" \
            --assets-dir release_assets \
            --output release_assets/update-manifest.json

      - name: Create Release
        # Единственное третьестороннее действие в репозитории, и у него токен
        # с правом писать релизы. Тег v2 подвижен: закрепляем по SHA, чтобы
        # содержимое действия нельзя было подменить задним числом.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          body_path: docs/release_notes/${{ github.ref_name }}.md
